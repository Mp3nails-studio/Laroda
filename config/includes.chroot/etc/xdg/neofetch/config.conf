# La Rosa neofetch config - własny ASCII-art (róża) zamiast domyślnego logo Debiana.
# Ten plik trafia do /etc/xdg/neofetch/config.conf, czyli systemowego default
# dla wszystkich użytkowników (chyba że ktoś ma własny ~/.config/neofetch/config.conf).

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info cols
}

# Wymuszamy własny plik ASCII (róża La Rosa) zamiast auto-wykrywania po dystrybucji.
# neofetch nie zna nazwy "La Rosa" w swojej wbudowanej liście ascii_distro,
# więc zamiast tego wskazujemy bezpośrednio na nasz plik.
image_backend="ascii"
image_source="/etc/xdg/neofetch/la-rosa-ascii.txt"

# Gradient czerwień -> róż -> magenta dla kwiatu, zielony dla łodygi/liścia
ascii_colors=(1 5 13 2)
ascii_bold="on"
